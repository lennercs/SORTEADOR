<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <title>Sorteador</title>
</head>

<body>

    <img src="./dado1.png" alt="dado">
    <p>DevSorteio</p>

    <div class="container">


        <h1>Sortear um Número</h1>
        
        <div class="number-control">
            <button class="number-control__menos">-</button>
            <input type="number" class="number-control__input-min" placeholder="Entre">
            <button class="number-control__mais">+</button>
        </div>


        <div class="number-control">
            <button class="number-control__menos">-</button>
            <input type="number" class="number-control__input-max" placeholder="E ">
            <button class="number-control__mais">+</button>
        </div>

        <span class="result-value">00</span>
        <button id="sortear">SORTEAR</button>
        <button id="limpar">LIMPAR</button>

    </div>



<script src="./script.js"></script>    

</body>



</html>
